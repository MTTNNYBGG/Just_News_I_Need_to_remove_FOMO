# UNVERIFIED candidates, all switched off. This file is NOT loaded by the app.
# To use one: copy its block into config/sources.toml, set enabled = true, restart, press Refresh, read the Sources page.
# Feedspot lists the Mail & Guardian and IOL addresses; Daily Maverick, Moneyweb, Premium Times and Nairametrics are from memory.
# STILL MISSING (most valuable for you): official feeds for SARB, SARS, Home Affairs, Eskom, Stellenbosch University,
# NSFAS, the Central Bank of Nigeria and Stats SA. Find each site's RSS/newsroom link and add with tier = "official".

[[sources]]
id = "mg-business"
name = "Mail & Guardian - Business"
url = "https://mg.co.za/section/business/feed"
tier = "reputable"
countries = ["South Africa"]
enabled = false
reuse = "Headline, link and short excerpt only"

