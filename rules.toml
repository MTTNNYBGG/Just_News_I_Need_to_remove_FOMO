# Editable pathway rules. Each rule is an explicit, inspectable claim: IF the text matches a keyword,
# THEN this documented mechanism MAY reach people with these activities/situations.
# Keywords also match simple plural/inflected forms (rate -> rates, hack -> hacked).
# Text in mechanism/consequence is the project's analytical inference, and is labelled as such in the UI.

[[rules]]
id = "borrowing-costs"
label = "Borrowing and savings rates"
categories = ["financial", "markets"]
keywords = ["interest rate", "repo rate", "mortgage rate", "rate hike", "rate cut", "lending standards", "credit availability", "loan repayments", "policy rate", "rates", "bank rate", "federal funds rate", "monetary policy", "discount rate", "mortgage", "loan", "lender", "credit", "borrowing costs", "savings rate", "interest on reserves", "reserve bank", "sarb", "prime rate"]
activities = ["borrowing_saving", "housing"]
situations = ["borrower", "saver_investor", "property_owner"]
direction = "mixed"
impact = 0.7
actionability = 0.5
hops = 1
global = false
mechanism = "Central-bank and lender decisions change the price of credit and the return on savings."
consequence = "Loan or mortgage repayments may rise or fall, and savings returns may change, depending on whether your debt or savings rates are variable."
monitor = "The lender's or central bank's next scheduled decision, and whether your own rate is variable or fixed."

[[rules]]
id = "education-costs"
label = "Tuition, funding and admissions"
categories = ["education"]
keywords = ["tuition", "scholarship", "bursary", "student funding", "student loan", "admissions", "university fees", "student accommodation", "university", "universities", "student", "students", "school fees", "college", "graduate", "exam fees", "student debt", "nsfas", "registration fee", "fee increase", "student housing", "stellenbosch", "vaal university", "higher education", "postgraduate"]
activities = ["studying", "applications", "expenses"]
situations = ["student", "prospective_student", "migrant"]
direction = "mixed"
impact = 0.7
actionability = 0.6
hops = 1
global = false
mechanism = "Universities and funders control fees, places, accommodation and scholarship budgets."
consequence = "Study costs, eligibility for funding, or the number of available places may change for people in your situation."
monitor = "The effective date, the eligibility criteria, and any application deadline in the primary announcement."

[[rules]]
id = "tax-levies"
label = "Taxes, levies and fees"
categories = ["government"]
keywords = ["vat", "value-added tax", "income tax", "tax rate", "levy", "tax bracket", "tax relief", "excise duty", "transaction fee", "tax", "taxes", "budget", "chancellor", "finance minister", "duty", "national insurance", "revenue authority", "bank charges", "sars", "south african revenue service", "efiling"]
activities = ["expenses", "employment", "business"]
situations = ["employed", "business_owner", "saver_investor"]
direction = "mixed"
impact = 0.6
actionability = 0.45
hops = 1
global = false
mechanism = "Governments and payment providers set charges that apply to many people at once; small amounts add up across purchases or income."
consequence = "Your take-home pay, purchase prices or recurring costs may change once the measure takes effect."
monitor = "The implementation date and any exemptions published by the authority."

